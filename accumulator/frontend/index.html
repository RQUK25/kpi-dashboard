<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accumulator Predictor</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- ====================== HEADER ====================== -->
  <header class="app-header">
    <div class="container header-inner">
      <div>
        <div class="app-title">Accumulator Predictor</div>
        <div class="app-subtitle">Statistical Build-a-Bet Analysis</div>
      </div>

      <div class="header-meta">
        <span class="matchday-date" id="matchday-date-display">—</span>
        <span class="leagues-covered" id="leagues-display">Loading…</span>
      </div>

      <div class="source-status-bar" id="source-status-bar">
        <!-- Populated by JS -->
      </div>

      <div class="header-controls">
        <div class="date-picker-group">
          <label for="date-input">Date</label>
          <input type="date" id="date-input" />
        </div>
        <button class="btn-refresh" id="refresh-btn" onclick="loadMatchday(window.DEMO_MODE||false)">Analyse</button>
      </div>
    </div>
  </header>

  <!-- ====================== MAIN ====================== -->
  <main class="container">

    <!-- Loading -->
    <div class="loading-overlay" id="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text">Fetching matchday data &amp; running analysis…</div>
    </div>

    <!-- Error -->
    <div class="error-banner hidden" id="error-banner"></div>

    <!-- Content (hidden until data loads) -->
    <div id="main-content" class="hidden">

      <!-- Summary bar -->
      <div class="summary-bar" id="summary-bar"></div>

      <!-- Tier cards -->
      <div class="tiers-grid" id="tiers-grid"></div>

      <!-- Matchups panel -->
      <section class="matchups-section">
        <h2 class="section-title">Key Matchday Matchups</h2>
        <div class="matchups-grid" id="matchups-grid">
          <div class="empty-state text-muted">No matchups identified.</div>
        </div>
      </section>

      <!-- Excluded selections -->
      <section class="excluded-section">
        <div class="collapsible-header" id="excluded-toggle" onclick="toggleExcluded()">
          <h2 class="section-title" style="margin-bottom:0;border-bottom:none;">
            Excluded Selections (Thin Value)
          </h2>
          <span class="excluded-count" id="excluded-count">0</span>
          <span class="collapsible-chevron">&#9660;</span>
        </div>
        <div class="collapsible-body" id="excluded-body"></div>
      </section>

    </div><!-- /main-content -->

  </main>

  <!-- ====================== FOOTER ====================== -->
  <footer>
    <div class="container">
      Data sources: <a href="https://www.football-data.org" target="_blank" rel="noopener">football-data.org</a> ·
      <a href="https://the-odds-api.com" target="_blank" rel="noopener">The-Odds-API</a> ·
      <a href="https://understat.com" target="_blank" rel="noopener">Understat</a> ·
      <a href="https://fbref.com" target="_blank" rel="noopener">FBref</a>
      &nbsp;|&nbsp; For informational purposes only.
    </div>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
